# ingestion/config/ingestion_config.yaml
#
# Khai báo CÁCH CHẠY từng nguồn cho Prefect flow (ingestion/flows/ingestion_flow.py).
# Chỉ chứa các nguồn THỰC SỰ chạy qua Extractor -> Validator -> Loader ->
# Postgres landing schema. Nguồn nào là script one-off (không qua Prefect,
# không vào landing schema) thì KHÔNG khai báo ở đây — xem ghi chú "holidays"
# bên dưới để hiểu vì sao.
 
sources:
  olist:
    type: file
    enabled: true
    source_dir: data/source/olist
    tables:
      - orders
      - order_items
      - customers
      - products
      - sellers
      - order_payments
      - order_reviews
      - geolocation
      - product_category_translation
    load_mode: full_refresh   # dataset tĩnh, tải 1 lần / full refresh
 
  weather:
    type: api
    enabled: true
    raw_dir: data/raw/weather
    date_range:
      start: "2016-09-01"     # khớp khung thời gian dữ liệu Olist
      end: "2018-10-31"
    rate_limit_per_minute: 60
    load_mode: append
 
  synthetic:
    type: generated
    enabled: true
    raw_dir: data/raw/synthetic
    n_drivers: 200
    seed: 42                   # cố định seed để tái lập được kết quả
    load_mode: full_refresh
 
  # --- holidays: KHÔNG còn ở đây kể từ khi đổi thiết kế (xem ghi chú) ---
  # Holiday + commercial event KHÔNG chạy qua Prefect/Postgres landing.
  # Đây là 2 SCRIPT ONE-OFF, chạy tay khi cần rebuild, output đi THẲNG vào
  # dbt seed — không có "raw_dir"/"load_mode" nào áp dụng cho chúng:
  #
  #   1. scripts/generate_holiday_seed.py
  #      -> gọi Nager.Date API + đọc olist_orders_dataset.csv
  #      -> ghi dbt/seeds/holidays.csv
  #
  #   2. scripts/generate_commercial_events_seed.py   (chạy SAU script #1,
  #      cần đọc lại dbt/seeds/holidays.csv để tính đúng baseline)
  #      -> ghi dbt/seeds/commercial_events.csv
  #
  # Cấu hình dùng chung cho 2 script này (CLEAN_WINDOW, COMMERCIAL_EVENTS,
  # ngưỡng tier) nằm trong scripts/event_impact_analysis.py, KHÔNG nằm ở
  # file YAML này — vì đó là logic tính toán (code), không phải tham số môi
  # trường (config).
 
postgres:
  schema_landing: landing
  batch_size: 5000