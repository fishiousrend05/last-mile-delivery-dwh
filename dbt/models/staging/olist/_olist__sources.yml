version: 2

sources:
  - name: landing_olist
    database: last_mile_dwh
    schema: landing
    tables:
      - name: olist_orders
        # Ví dụ cấu hình freshness (độ trễ dữ liệu) cho bảng orders
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        loaded_at_field: order_purchase_timestamp
      - name: olist_order_items
      - name: olist_order_payments
      - name: olist_order_reviews
      - name: olist_customers
      - name: olist_sellers
      - name: olist_products
      - name: product_category_translation
      - name: olist_geolocation