# dbt/models/intermediate/extension/_int_extension__models.yml

version: 2

models:
  - name: int_driver_versions
    description: >
      1 dòng/version SCD2 của driver (chuẩn hóa từ snap_driver). Version đầu
      tiên của mỗi driver có row_effective_date = hire_date (không phải
      dbt_valid_from thô) — xem giải thích trong model. Dùng để build
      dim_driver và để point-in-time join driver_key trong fact_delivery_attempts.
    columns:
      - name: driver_version_id
        description: Surrogate key — grain của bảng này (1 dòng/version).
        tests:
          - unique
          - not_null
      - name: driver_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_synthetic__drivers')
              field: driver_id
      - name: version_number
        tests:
          - not_null
      - name: row_effective_date
        tests:
          - not_null
      - name: row_end_date
        tests:
          - not_null
      - name: driver_status
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'inactive']
      - name: is_current
        tests:
          - not_null
    tests:
      - dbt_utils.expression_is_true:
          expression: "row_effective_date <= row_end_date"

  - name: int_delivery_attempts
    description: >
      1 dòng/lần giao mô phỏng — enrich stg_synthetic__delivery_attempts với
      flag first/final attempt, driver point-in-time (qua int_driver_versions)
      và weather tại thời điểm attempt (khác delivery date của
      fact_order_lifecycle).
    columns:
      - name: attempt_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('int_order_lifecycle')
              field: order_id
      - name: zone_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_zone')
              field: zone_id
      - name: attempt_status
        tests:
          - accepted_values:
              arguments:
                values: ['success', 'failed']
      - name: is_final_attempt_flag
        tests:
          - not_null
      - name: driver_version_id
        tests:
          - not_null:
              config:
                severity: warn   # NULL chỉ có thể xảy ra nếu không tìm được version driver nào khớp range — bất thường, cần điều tra chứ không nên chặn build
          - relationships:
              to: ref('int_driver_versions')
              field: driver_version_id
      - name: attempt_weather_key
        tests:
          - relationships:
              to: ref('dim_weather')
              field: weather_key
              config:
                where: "attempt_weather_key is not null"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['order_id', 'attempt_number']